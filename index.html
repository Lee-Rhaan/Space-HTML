<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>SOLAR DRIFT — Deep Space Explorer</title>
<style>
:root{--pn:rgba(6,14,30,.66);--ln:rgba(120,200,255,.24);--cy:#6fe3ff;--tx:#e8f2ff;--dim:#8ea4c0;--wa:#ffb35c;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:13px/1.35 "Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#c,#fb{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pn{background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px}
.hid{display:none!important}
button,select{font:inherit;color:var(--tx);background:rgba(20,44,76,.55);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;min-height:34px;cursor:pointer;touch-action:manipulation}
button:hover,button.on{border-color:var(--cy);background:rgba(40,96,148,.6)}
button:focus-visible,select:focus-visible{outline:2px solid var(--cy)}
button:disabled{opacity:.4;cursor:default}
#hud>*{position:fixed}
#tl{top:calc(8px + var(--st));left:calc(8px + var(--sl));padding:8px 11px;max-width:min(300px,56vw)}
.brand{font-weight:600;letter-spacing:.14em;font-size:12px}
#stat{color:var(--cy);font-size:11px;margin-top:2px}
#tele{margin-top:6px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;white-space:pre-line}
#tele b{color:var(--tx);font-weight:500}
#tr{top:calc(8px + var(--st));right:calc(8px + var(--sr));display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
#dest{top:calc(108px + var(--st));left:calc(8px + var(--sl));width:min(250px,60vw);max-height:calc(100% - 230px - var(--st));overflow:auto;padding:6px;touch-action:pan-y}
#dest button{display:block;width:100%;text-align:left;margin:2px 0;min-height:32px;padding:4px 9px}
#dest .m{padding-left:22px;font-size:12px;color:var(--dim)}
#dest h4{margin:8px 4px 3px;font-weight:500;color:var(--dim);font-size:11px}
#set{top:calc(48px + var(--st));right:calc(8px + var(--sr));width:min(260px,70vw);padding:10px;display:grid;gap:8px}
#set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#card{bottom:calc(10px + var(--sb));left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 16px));padding:9px 12px;max-height:46vh;overflow:auto;touch-action:pan-y}
.ch{display:flex;align-items:baseline;gap:8px}.ch b{font-size:16px;font-weight:600}.ch span{color:var(--dim);flex:1}
.cg{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0;font-size:12px}.cg i{color:var(--dim);font-style:normal}
.cf{color:#c4d6ec;font-size:12px;margin:4px 0}.cn{color:var(--dim);font-size:10.5px}
.ca{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#card.mini .cg,#card.mini .cf,#card.mini .cn{display:none}
#warn{top:calc(70px + var(--st));left:50%;transform:translateX(-50%);color:var(--wa);font-weight:600;letter-spacing:.05em;text-align:center;pointer-events:none;text-shadow:0 0 8px #000}
#toast{top:30%;left:50%;transform:translateX(-50%);padding:7px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:20px;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
#lbls div{position:fixed;left:0;top:0;font-size:11px;color:#bfe9ff;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none;will-change:transform}
#lbls div:before{content:"";display:inline-block;width:5px;height:5px;border:1px solid #bfe9ff;border-radius:50%;margin-right:5px;vertical-align:middle}
#mk{left:0;top:0;pointer-events:none;will-change:transform;color:var(--cy);font-size:11px;white-space:nowrap}
#mk:before{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:1.5px solid var(--cy);transform:rotate(45deg);border-radius:3px}
#mk span{position:absolute;left:20px;top:-8px;text-shadow:0 0 5px #000}
#pro{left:0;top:0;width:16px;height:16px;margin:-8px;border:1.5px solid #9fffbd;border-radius:50%;pointer-events:none;opacity:.8}
#cross{left:50%;top:50%;width:24px;height:24px;margin:-12px;pointer-events:none;opacity:.55;background:linear-gradient(var(--tx),var(--tx)) 50% 0/1px 7px no-repeat,linear-gradient(var(--tx),var(--tx)) 50% 100%/1px 7px no-repeat,linear-gradient(var(--tx),var(--tx)) 0 50%/7px 1px no-repeat,linear-gradient(var(--tx),var(--tx)) 100% 50%/7px 1px no-repeat}
#bar{bottom:calc(10px + var(--sb));left:calc(8px + var(--sl));display:flex;gap:5px;flex-wrap:wrap;max-width:44vw}
#touch{display:none}
.touch #touch{display:block}
.touch #bar{bottom:auto;left:auto;right:calc(8px + var(--sr));top:calc(54px + var(--st));flex-direction:column;max-width:none}
.touch #tr{max-width:70vw}
.touch #card{width:min(380px,44vw)}
.touch #dest{top:calc(98px + var(--st))}
#joy{left:calc(22px + var(--sl));bottom:calc(26px + var(--sb));width:124px;height:124px;border-radius:50%;border:1.5px solid var(--ln);background:rgba(10,30,56,.28);touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:rgba(111,227,255,.35);border:1.5px solid var(--cy)}
#tb{right:calc(14px + var(--sr));bottom:calc(20px + var(--sb));display:grid;grid-template-columns:repeat(2,64px);gap:8px}
#tb button{min-height:60px;border-radius:14px;font-size:12px;touch-action:none}
#warpfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 25%,rgba(40,120,255,.35) 70%,rgba(160,230,255,.7) 100%)}
#diag{top:calc(100px + var(--st));right:calc(8px + var(--sr));padding:9px 11px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-width:min(400px,92vw);max-height:60vh;overflow:auto;position:fixed;z-index:6;touch-action:pan-y}
#map{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%)}
#pbar{position:fixed;z-index:5;bottom:calc(14px + var(--sb));left:50%;transform:translateX(-50%);display:flex;gap:8px}
#intro{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100% - 20px);overflow:auto;padding:18px 20px;touch-action:pan-y}
#intro h1{margin:0 0 2px;font-size:22px;letter-spacing:.16em;font-weight:600}
#intro p{margin:6px 0;color:#c4d6ec}
#intro table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}#intro td{padding:2px 6px 2px 0;color:var(--dim)}#intro td:first-child{color:var(--tx);white-space:nowrap}
#err{position:fixed;z-index:10;inset:0;background:#02040a;color:#ffd7b0;padding:20px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;touch-action:pan-y}
body.nohud #hud{display:none}
body.photo #hud{display:none}
@media (max-height:480px){#tl{padding:5px 8px}#tele{display:none}#dest{top:calc(60px + var(--st))}.touch #card{max-height:38vh}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<canvas id="c"></canvas><canvas id="fb" class="hid"></canvas>
<div id="warpfx"></div>
<div id="hud">
 <div id="tl" class="pn"><div class="brand">SOLAR DRIFT</div><div id="stat">Starting renderer…</div><div id="tele"></div></div>

 <div id="dest" class="pn hid"></div>

 </div>
</div>
<div id="diag" class="pn hid"></div>
<canvas id="map" class="pn hid"></canvas>
<div id="pbar" class="hid"><button id="pCap">Capture image</button><button id="pExit">Exit photo mode</button></div>
<div id="intro" class="pn">
 <h1>SOLAR DRIFT</h1><div style="color:var(--dim)">Deep space explorer — procedural WebGL2, no downloads</div>
 <p id="introStat" style="color:var(--cy)">Starting renderer…</p>
 <table id="ctlTab"></table>
 <p style="font-size:12px;color:var(--dim)">Navigation uses a compressed scale: ordering and relative spacing are kept, but game distances are not real kilometres. Real values are shown in each body’s info card.</p>
 <button id="go" disabled style="width:100%;min-height:42px">Launch</button>
</div>
<div id="err" class="hid"></div>

<script>
'use strict';
/* =====================================================================
   SOLAR DRIFT — single-file WebGL2 solar system explorer

   craft/camera · navigation · HUD · input · audio · main loop
   ===================================================================== */
const $=id=>document.getElementById(id),TAU=Math.PI*2,D2R=Math.PI/180;

const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const len=a=>Math.hypot(a[0],a[1],a[2]);
function nrm(a){const l=len(a)||1;a[0]/=l;a[1]/=l;a[2]/=l;return a}

function rot(v,k,a){const c=Math.cos(a),s=Math.sin(a),d=(k[0]*v[0]+k[1]*v[1]+k[2]*v[2])*(1-c);
 const x=k[1]*v[2]-k[2]*v[1],y=k[2]*v[0]-k[0]*v[2],z=k[0]*v[1]-k[1]*v[0];
 v[0]=v[0]*c+x*s+k[0]*d;v[1]=v[1]*c+y*s+k[1]*d;v[2]=v[2]*c+z*s+k[2]*d}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ============================ DIAGNOSTICS ============================ */

function logErr(m){diag.errors.push(m);console.error('[SolarDrift] '+m);updDiag()}
function updDiag(){const d=$('diag');if(d.classList.contains('hid'))return;
 d.textContent=['GRAPHICS  '+diag.api,'RENDERER  '+diag.renderer,'INIT      '+(diag.ready?'first frame rendered':'waiting for first frame'),'FRAME CHK '+diag.px,
 'SHADERS   '+(Object.entries(diag.shaders).map(([k,v])=>k+':'+v).join(' ')||'—'),'CANVAS    css '+diag.css+' · buffer '+diag.buf,'RES SCALE '+st.rs.toFixed(2)+' · DPR '+(window.devicePixelRatio||1).toFixed(2),
 'FPS       '+diag.fps.toFixed(0)+' · '+diag.ms.toFixed(1)+' ms','QUALITY   '+Q[st.q].n+' · draw calls '+diag.draws+' · stars '+Q[st.q].stars,
 ...diag.warnings.map(w=>'WARN '+w),...diag.errors.map(e=>'ERROR '+e)].join('\n')}

/* ============================ DATA ============================ */
// name,type,R,parent,a,period(d),rotation(h),axial tilt,orbit tilt,phase,tint,info(au;km;temp;moons;g;atmosphere;fact)
const RAW=[
['Sun',0,120,-1,0,1,609.1,7.25,0,0,[1,1,1],'0;1392700;5,500 °C surface;0;274 m/s²;Hydrogen 73%, helium 25%;Holds 99.86% of the Solar System’s mass. Its light takes 8 min 20 s to reach Earth.'],
['Mercury',1,3,0,560,88,1407.6,0.03,7,.5,[.75,.72,.7],'0.39;4,879;167 °C mean (−180 to 430);0;3.7 m/s²;Trace exosphere;A solar day lasts 176 Earth days; its iron core is huge for its size.'],
['Venus',2,7.2,0,765,224.7,-5832.5,177.4,3.4,2.1,[1,.86,.52],'0.72;12,104;464 °C;0;8.9 m/s²;CO₂ 96%, N₂ 3%;It spins backwards, so the Sun rises in the west. Surface pressure is 92× Earth’s.'],
['Earth',3,7.5,0,900,365.25,23.93,23.4,0,4.2,[1,1,1],'1.00;12,742;15 °C mean;1;9.8 m/s²;N₂ 78%, O₂ 21%;The only known world with liquid surface oceans and life.'],
['Moon',1,2,3,24,27.32,655.7,6.7,5.1,1,[.92,.92,.92],'1.00;3,475;−20 °C mean (−173 to 127);—;1.6 m/s²;Almost none;Always shows the same face to Earth and drifts away 3.8 cm every year.'],
['Mars',4,4,0,1110,687,24.62,25.2,1.85,5.5,[1,1,1],'1.52;6,779;−63 °C mean;2;3.7 m/s²;CO₂ 95%, very thin;Olympus Mons is about 22 km tall, the biggest known volcano.'],
['Phobos',1,.8,5,9,.319,7.65,0,1,0,[.55,.5,.47],'1.52;22;−40 °C;—;0.006 m/s²;None;Orbits so low it circles Mars three times a day and is slowly spiralling in.'],
['Deimos',1,.6,5,14,1.26,30.3,0,1.8,2,[.6,.55,.5],'1.52;12;−40 °C;—;0.003 m/s²;None;The smaller, outer moon of Mars; likely a captured asteroid.'],
['Jupiter',5,40,0,2050,4333,9.93,3.1,1.3,1.1,[1,1,1],'5.20;139,820;−110 °C cloud tops;95;24.8 m/s²;H₂ 90%, He 10%;The Great Red Spot is a storm wider than Earth, active for centuries.'],
['Io',1,2.2,8,62,1.77,42.5,0,3.1,0,[1,.86,.42],'5.20;3,643;−143 °C;—;1.8 m/s²;Thin SO₂;The most volcanically active body in the Solar System.'],
['Europa',9,2,8,78,3.55,85.2,0,3.1,2,[.92,.86,.78],'5.20;3,122;−160 °C;—;1.3 m/s²;Thin oxygen;A global ocean under an icy shell holds more water than all of Earth’s seas.'],
['Ganymede',1,3.4,8,98,7.15,171.7,0,3.1,4,[.62,.57,.52],'5.20;5,268;−163 °C;—;1.4 m/s²;Thin oxygen;The largest moon in the Solar System, bigger than Mercury.'],
['Callisto',1,3,8,122,16.69,400.5,0,3.1,5,[.42,.38,.35],'5.20;4,821;−139 °C;—;1.2 m/s²;Trace CO₂;One of the most heavily cratered surfaces known.'],
['Saturn',6,34,0,2786,10759,10.7,26.7,2.5,3,[1,1,1],'9.58;116,460;−140 °C cloud tops;146;10.4 m/s²;H₂ 96%, He 3%;Its rings span 280,000 km yet are mostly under 100 m thick. It is less dense than water.'],
['Titan',2,3.3,13,125,15.95,382.7,0,26.7,0,[.95,.6,.26],'9.58;5,150;−179 °C;—;1.4 m/s²;N₂ 95%, CH₄ 5%;The only moon with a thick atmosphere, and lakes of liquid methane.'],
['Enceladus',9,1,13,92,1.37,32.9,0,26.7,3,[1,1,1],'9.58;504;−198 °C;—;0.11 m/s²;Water vapour plumes;Geysers at its south pole feed Saturn’s E ring.'],
['Uranus',7,16,0,3944,30687,-17.24,97.8,.8,5,[1,1,1],'19.2;50,724;−195 °C;28;8.9 m/s²;H₂ 83%, He 15%, CH₄ 2%;It rolls around the Sun on its side, tilted nearly 98°.'],
['Neptune',8,15.5,0,4938,60190,16.1,28.3,1.8,.3,[1,1,1],'30.1;49,244;−200 °C;16;11.2 m/s²;H₂ 80%, He 19%, CH₄ 1%;Winds reach about 2,100 km/h, the fastest measured in the Solar System.'],
['Pluto',10,2.5,0,5657,90560,-153.3,119.6,17.2,1.5,[.96,.86,.76],'39.5;2,377;−229 °C;5;0.62 m/s²;Thin N₂, CH₄;Tombaugh Regio, a huge heart-shaped glacier of nitrogen ice, is on its face.'],
['Charon',1,1.3,18,8,6.39,153.3,0,119.6,0,[.55,.5,.5],'39.5;1,212;−220 °C;—;0.29 m/s²;None;Pluto and Charon orbit a point between them, a double-world system.']
];
const TYPE=['Star','Rocky planet','Rocky planet','Rocky planet','Rocky planet','Gas giant','Gas giant','Ice giant','Ice giant','Icy moon','Dwarf planet'];
const ATM={2:[1,.8,.4,.7],3:[.3,.55,1,1],5:[.9,.7,.5,.4],6:[.9,.8,.55,.35],7:[.5,.9,1,.6],8:[.3,.5,1,.7],4:[.9,.55,.35,.3],14:[1,.6,.2,.8]};
const B=RAW.map((r,i)=>({i,name:r[0],t:r[1],R:r[2],par:r[3],a:r[4],per:r[5],rot:r[6],tilt:r[7]*D2R,ot:r[8],ph:r[9],tint:r[10],info:r[11].split(';'),
 p:[0,0,0],p0:[0,0,0],vel:[0,0,0],m:new Float32Array(9),rel:[0,0,0],d:0,
 ring:r[0]==='Saturn'?[1.25,2.3,.95,[.86,.78,.62]]:r[0]==='Uranus'?[1.55,2.0,.22,[.6,.7,.75]]:null,atm:ATM[i]||(r[1]===2?ATM[2]:null)}));
B[14].atm=ATM[14];B[2].atm=ATM[2];
const MOONS=B.filter(b=>b.par>0).map(b=>b.i);
const Q=[{n:'Low',dpr:1,stars:15000,oct:3,neb:2},{n:'Medium',dpr:1.25,stars:40000,oct:4,neb:3},{n:'High',dpr:1.6,stars:70000,oct:5,neb:4},{n:'Ultra',dpr:2,stars:100000,oct:6,neb:5}];
const TS=[0,.025,.1,.5,2,10],TSL=['⏸','×0.25','×1','×5','×20','×100'];
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const st={q:touch?1:2,rs:1,mode:1,sens:1,fx:true,labels:true,photo:false,mute:false,sc:false,cruise:false,warpOn:false,warp:0,ap:false,lock:false,sel:null,tIdx:2,visited:new Set(),cap:false,apVis:0};
const sim={days:0};
function updBodies(dt){
 for(const b of B){b.p0[0]=b.p[0];b.p0[1]=b.p[1];b.p0[2]=b.p[2];
  if(b.i){const P=B[b.par],th=b.ph+TAU*sim.days/b.per,c=Math.cos(th)*b.a,s=Math.sin(th)*b.a,o=b.ot*D2R;
   b.p[0]=P.p[0]+c;b.p[1]=P.p[1]-s*Math.sin(o);b.p[2]=P.p[2]+s*Math.cos(o)}
  if(dt>1e-5&&!b.jump){b.vel[0]=(b.p[0]-b.p0[0])/dt;b.vel[1]=(b.p[1]-b.p0[1])/dt;b.vel[2]=(b.p[2]-b.p0[2])/dt}else{b.vel[0]=b.vel[1]=b.vel[2]=0;b.jump=false}
  const sp=.25*TAU*sim.days*24/b.rot,c=Math.cos(sp),s=Math.sin(sp),ct=Math.cos(b.tilt),sT=Math.sin(b.tilt),m=b.m;
  m[0]=c;m[1]=sT*s;m[2]=-ct*s;m[3]=0;m[4]=ct;m[5]=sT;m[6]=s;m[7]=-sT*c;m[8]=ct*c}}
updBodies(0);

/* ============================ GLSL ============================ */
const V3='#version 300 es\nprecision highp float;precision highp int;\n';
const NOISE=`
float h(vec3 p){p=50.*fract(p*.3183099+vec3(.71,.113,.419));return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float nz(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
